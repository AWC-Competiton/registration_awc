<!doctype html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
<title>REGISTRATION AWC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">

  <div class="logo-container">
    <img
      src="photo_2026-08-12_23-09-43.jpg"
      alt="AWC Competition Logo"
      class="competition-logo"
    >
  </div>

  <h1>REGISTRATION AWC</h1>

  <p class="muted">
    សូមបំពេញព័ត៌មានឱ្យបានត្រឹមត្រូវ និងបង់ថ្លៃចុះឈ្មោះតាម KHQR
  </p>

      <div id="alert" class="alert hidden"></div>

      <form id="registrationForm">
        <label for="full_name">ឈ្មោះពេញ *</label>
        <input id="full_name" required maxlength="150" placeholder="ឧ. សុខ សុភា">

        <div class="form-group">
        <label for="student_name_en">ឈ្មោះជាឡាតាំង</label>
          <input
            type="text"
            id="student_name_en"
            name="student_name_en"
            placeholder="Ex: Sok Sopha"
            required
          >
        </div>

        <label for="gender">ភេទ *</label>
        <select id="gender" required>
          <option value="">-- ជ្រើសរើស --</option>
          <option value="ប្រុស">ប្រុស</option>
          <option value="ស្រី">ស្រី</option>
          <option value="ផ្សេងទៀត">ផ្សេងទៀត</option>
        </select>

        <label for="grade">កម្រិតថ្នាក់ *</label>
        <select id="grade" required>
          <option value="">-- ជ្រើសរើសថ្នាក់ --</option>
          <option value="៧">៧</option><option value="៨">៨</option>
          <option value="៩">៩</option><option value="១០">១០</option>
          <option value="១១">១១</option><option value="១២">១២</option>
        </select>

        <label for="school_name">ឈ្មោះសាលា *</label>
        <input id="school_name" required maxlength="200" placeholder="ឈ្មោះសាលា">

        <label for="province">រាជធានី/ខេត្ត *</label>
        <select id="province" required></select>

        <div class="payment">
          <h2>បង់ថ្លៃចុះឈ្មោះ</h2>
          <p id="paymentText">សូមស្កេន KHQR ខាងក្រោម រួច Upload វិក្កយបត្រ។</p>
          <img
              id="khqrImage"
              src="candidate/photo_2026-08-12_12-12-31.jpg"
              alt="KHQR Payment"
              class="khqr"
          >
          <p id="khqrMissing" class="warning hidden">Admin មិនទាន់កំណត់ KHQR ទេ។</p>
        </div>

        <label for="receipt">Upload វិក្កយបត្រ *</label>
        <input id="receipt" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required>
        <small>អនុញ្ញាត JPG, PNG, WEBP ឬ PDF (អតិបរមា 5MB)</small>

        <button id="submitBtn" type="submit">ដាក់ពាក្យចុះឈ្មោះ</button>
      </form>

      <div id="success" class="success hidden"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
